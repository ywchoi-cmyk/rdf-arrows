<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDF Arrows — 웹 온톨로지 모델러</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='12' height='9' rx='2' fill='%232f6fec'/%3E%3Crect x='18' y='19' width='12' height='9' rx='2' fill='%232f6fec'/%3E%3Cpath d='M9 13 L22 19' stroke='%233d4555' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --line:#e3e6ea; --text:#1d2330; --muted:#6b7380;
  --accent:#2f6fec; --accent-weak:#e8f0fe; --danger:#d93025; --edge:#3d4555; --sub:#8a919c;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--font);color:var(--text);background:var(--bg);font-size:14px}
button{font:inherit;cursor:pointer}
header{height:52px;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;margin-right:10px;white-space:nowrap}
.brand small{font-weight:400;color:var(--muted);margin-left:6px}
.tb{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;color:var(--text);white-space:nowrap}
.tb:hover{background:#f2f4f7}
.tb:disabled{opacity:.4;cursor:default}
.tb.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tb.primary:hover{background:#2560d6}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.spacer{flex:1}
main{position:absolute;top:52px;left:0;right:0;bottom:0;display:flex}
#canvasWrap{position:relative;flex:1;overflow:hidden}
#canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none;
  background-image:radial-gradient(#d5d9df 1px,transparent 1px);background-size:22px 22px}
#panel{width:330px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px}
#panel h3{margin:0 0 12px;font-size:15px}
#panel h4{margin:18px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input[type=text],.field textarea,.field select,.attr input,.attr select{
  width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit;background:#fff;color:var(--text)}
.field textarea{min-height:64px;resize:vertical}
.field input:focus,.field textarea:focus,.attr input:focus,.attr select:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
.mono{font-family:var(--mono);font-size:12px}
.hint{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;word-break:break-all}
.warn{font-size:12px;color:var(--danger);margin-top:4px}
.info{font-size:12px;background:var(--accent-weak);border-radius:6px;padding:8px;line-height:1.5;margin-bottom:11px}
.attr{display:grid;grid-template-columns:1fr 118px 28px;gap:6px;margin-bottom:6px}
.attr select{padding:7px 4px;font-size:12px}
.x{border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--muted)}
.x:hover{color:var(--danger);border-color:var(--danger)}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px}
.btn:hover{background:#f2f4f7}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:#fdecea}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:7px}
.seg button.on{background:var(--accent);color:#fff}
.swatches{display:flex;gap:6px}
.swatch{width:24px;height:24px;border-radius:50%;border:1px solid #c9ced6}
.swatch.on{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.linklist{list-style:none;padding:0;margin:0}
.linklist li{padding:5px 6px;border-radius:5px;cursor:pointer;font-size:13px}
.linklist li:hover{background:#f2f4f7}
.help{font-size:12.5px;line-height:1.75;color:#3a4250;background:#f8f9fb;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.help b{color:var(--text)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid #cfd4db;border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff}
#zoomCtl{position:absolute;left:12px;bottom:12px;display:flex;gap:4px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
#zoomCtl button{border:0;background:transparent;width:28px;height:26px;border-radius:5px}
#zoomCtl button:hover{background:#f2f4f7}
#zoomLabel{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#empty[hidden]{display:none}
#empty .card{pointer-events:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 26px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.05)}
#empty .card p{margin:6px 0;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2330;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:80vw}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(20,24,32,.45);display:flex;align-items:center;justify-content:center;z-index:40}
#modal[hidden]{display:none}
#modal .box{background:#fff;border-radius:12px;width:min(860px,94vw);height:min(720px,90vh);display:flex;flex-direction:column;overflow:hidden}
#modal .mh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
#modal .mh b{flex:1}
#ttlOut{flex:1;border:0;padding:14px;font-family:var(--mono);font-size:12.5px;resize:none;outline:none;white-space:pre;line-height:1.5}
#ttlStatus{padding:8px 14px;border-top:1px solid var(--line);font-size:12px}
#ttlStatus .ok{color:#188038}
#ttlStatus .bad{color:var(--danger)}
#dropOverlay{position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:12px;background:rgba(47,111,236,.06);display:none;align-items:center;justify-content:center;color:var(--accent);font-weight:600;pointer-events:none}
#dropOverlay.on{display:flex}

/* SVG */
.node .body{stroke:#9aa2ad;stroke-width:1.2}
.node.external .body{stroke-dasharray:5 3}
.node.dup .body{stroke:var(--danger);stroke-width:2}
.node.selected .body{stroke:var(--accent);stroke-width:2.2}
.node .halo{fill:transparent;stroke:transparent;stroke-width:1;pointer-events:all;cursor:crosshair}
.node:hover .halo,.node.linktarget .halo{fill:rgba(47,111,236,.10);stroke:rgba(47,111,236,.45)}
.node .body{cursor:move}
.node text{pointer-events:none}
.node .title{font-weight:700;font-size:13px;fill:var(--text)}
.node .sub{font-size:10.5px;fill:var(--muted)}
.node .attrtext{font-size:12px;fill:#3a4250}
.node .divider{stroke:#d5d9df}
.edge .hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.edge .line{fill:none;stroke:var(--edge);stroke-width:1.6;pointer-events:none}
.edge.sub .line{stroke:var(--sub)}
.edge.selected .line{stroke:var(--accent);stroke-width:2.2}
.edge .pill{fill:#fff;stroke:#c9ced6}
.edge.selected .pill{stroke:var(--accent)}
.edge .ltext{font-size:12px;fill:var(--edge);pointer-events:none}
.edge.sub .ltext{fill:var(--sub);font-style:italic;font-size:11px}
.edge .pill,.edge .ltext{cursor:pointer}
.temp{stroke:var(--accent);stroke-width:1.6;stroke-dasharray:6 4;fill:none;pointer-events:none}
</style>
</head>
<body>
<header>
  <div class="brand">RDF Arrows<small>온톨로지 모델러</small></div>
  <button class="tb" id="bNew" title="새 캔버스 (실행 취소로 되돌릴 수 있음)">새로 만들기</button>
  <button class="tb" id="bOpen" title="Turtle 파일 불러오기 (캔버스에 끌어다 놓아도 됨)">TTL 불러오기</button>
  <button class="tb" id="bSample">예시</button>
  <div class="sep"></div>
  <button class="tb" id="bLayout" title="노드 자동 배치">자동 정렬</button>
  <button class="tb" id="bUndo" title="실행 취소 (Ctrl/⌘+Z)">↶</button>
  <button class="tb" id="bRedo" title="다시 실행 (Ctrl/⌘+Shift+Z)">↷</button>
  <div class="spacer"></div>
  <button class="tb" id="bView">TTL 보기</button>
  <button class="tb primary" id="bDownload">TTL 내려받기</button>
</header>
<main>
  <div id="canvasWrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d4555"/></marker>
        <marker id="arrow-sel" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fec"/></marker>
        <marker id="tri" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L12,6 L1,11 z" fill="#fff" stroke="#8a919c" stroke-width="1.4"/></marker>
        <marker id="tri-sel" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L12,6 L1,11 z" fill="#fff" stroke="#2f6fec" stroke-width="1.6"/></marker>
      </defs>
      <g id="viewport"><g id="edges"></g><g id="nodes"></g><g id="overlay"></g></g>
    </svg>
    <div id="empty" hidden>
      <div class="card">
        <b>빈 곳을 더블클릭해서 클래스를 만드세요</b>
        <p>클래스 테두리를 끌어 다른 클래스에 놓으면 관계가 생깁니다.</p>
        <p>.ttl 파일을 여기에 끌어다 놓아도 됩니다.</p>
        <div style="margin-top:12px"><button class="tb" id="bSample2">예시로 시작하기</button></div>
      </div>
    </div>
    <div id="dropOverlay">여기에 놓으면 TTL을 불러옵니다</div>
    <div id="zoomCtl">
      <button id="zOut" title="축소">−</button><span id="zoomLabel">100%</span><button id="zIn" title="확대">+</button>
      <button id="zFit" title="화면에 맞추기">⤢</button>
    </div>
  </div>
  <aside id="panel"></aside>
</main>

<div id="modal" hidden>
  <div class="box">
    <div class="mh"><b>Turtle 미리보기</b>
      <button class="btn" id="mCopy">복사</button>
      <button class="btn" id="mDownload">내려받기</button>
      <button class="btn" id="mClose">닫기</button>
    </div>
    <textarea id="ttlOut" readonly spellcheck="false"></textarea>
    <div id="ttlStatus"></div>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".ttl,.turtle,.nt,.n3,text/turtle" hidden>

<script src="lib/n3.min.js"></script>
<script>
(() => {
'use strict';

/* ---------- 상수 ---------- */
const NS = 'http://www.w3.org/2000/svg';
const FONT = getComputedStyle(document.documentElement).getPropertyValue('--font').trim();
const STORAGE_KEY = 'rdf-arrows:v1';
const LAYOUT_TAG = 'rdf-arrows-layout:';
const STD = {
  rdf: 'http://www.w3.org/1999/02/22-rdf-syntax-ns#',
  rdfs: 'http://www.w3.org/2000/01/rdf-schema#',
  owl: 'http://www.w3.org/2002/07/owl#',
  xsd: 'http://www.w3.org/2001/XMLSchema#'
};
const XSD_TYPES = ['xsd:string','xsd:integer','xsd:decimal','xsd:double','xsd:boolean','xsd:date','xsd:dateTime','xsd:anyURI','rdf:langString','rdfs:Literal'];
const COLORS = ['#ffffff','#e8f0fe','#e6f4ea','#fef7e0','#fce8e6','#f3e8fd','#e0f7fa'];

/* ---------- 상태 ---------- */
function blankState(){
  return {
    meta: { title: '새 온톨로지', ontologyIri: 'http://example.org/onto', baseIri: 'http://example.org/onto#', prefix: 'ex', lang: 'ko', extraPrefixes: '' },
    nodes: [], edges: [], seq: 1
  };
}
let state = blankState();
let view = { x: 0, y: 0, k: 1 };
let selection = null;           // {type:'node'|'edge', id}

const $ = s => document.querySelector(s);
const svg = $('#canvas'), gView = $('#viewport'), gEdges = $('#edges'), gNodes = $('#nodes'), gOverlay = $('#overlay');

const uid = p => p + (state.seq++);
const nodeById = id => state.nodes.find(n => n.id === id);
const edgeById = id => state.edges.find(e => e.id === id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 저장 / 실행 취소 ---------- */
const undoStack = [], redoStack = [];
const snap = () => JSON.stringify(state);
function checkpoint(){
  const s = snap();
  if (undoStack[undoStack.length - 1] !== s) { undoStack.push(s); if (undoStack.length > 300) undoStack.shift(); }
  redoStack.length = 0; updateHistoryButtons();
}
function undo(){
  const cur = snap();
  while (undoStack.length){ const s = undoStack.pop(); if (s !== cur){ redoStack.push(cur); state = JSON.parse(s); afterHistory(); return; } }
  updateHistoryButtons();
}
function redo(){
  const cur = snap();
  while (redoStack.length){ const s = redoStack.pop(); if (s !== cur){ undoStack.push(cur); state = JSON.parse(s); afterHistory(); return; } }
  updateHistoryButtons();
}
function afterHistory(){
  if (selection && !(selection.type === 'node' ? nodeById(selection.id) : edgeById(selection.id))) selection = null;
  renderAll(); persist(); updateHistoryButtons();
}
function updateHistoryButtons(){ $('#bUndo').disabled = !undoStack.length; $('#bRedo').disabled = !redoStack.length; }
let persistTimer = null;
function persist(){
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ state, view })); } catch (e) {} }, 250);
}

/* ---------- 이름 / IRI ---------- */
function deriveName(label, kind){
  const tokens = String(label).trim().split(/[^\p{L}\p{N}_]+/u).filter(Boolean);
  if (!tokens.length) return '';
  let out = tokens.map((t, i) => {
    const f = t[0];
    if (kind === 'class' || i > 0) return /[a-z]/.test(f) ? f.toUpperCase() + t.slice(1) : t;
    if (/[A-Z]/.test(f) && (t.length === 1 || /[a-z]/.test(t[1]))) return f.toLowerCase() + t.slice(1);
    return t;
  }).join('');
  if (/^\p{N}/u.test(out)) out = '_' + out;
  return out;
}
function prefixMap(){
  const m = Object.assign({}, STD);
  String(state.meta.extraPrefixes || '').split(/\n/).forEach(line => {
    const mm = line.trim().match(/^@?(?:prefix\s+)?([A-Za-z][\w\-]*)?\s*:\s*<?\s*(\S+?)\s*>?\s*\.?$/i);
    if (mm && mm[2]) m[mm[1] || ''] = mm[2];
  });
  m[state.meta.prefix || ''] = state.meta.baseIri;
  return m;
}
const SAFE_LOCAL = /^[\p{L}_][\p{L}\p{N}_\-]*$/u;
const encLocal = s => String(s).replace(/[\s<>"{}|^`\\]/g, c => encodeURIComponent(c));
/** 사용자가 입력한 이름 → 전체 IRI */
function fullIri(name, pm = prefixMap()){
  name = String(name || '').trim();
  if (/^(https?):\/\//i.test(name) || /^urn:/i.test(name)) return name;
  const m = name.match(/^([A-Za-z][\w\-]*)?:(.*)$/);
  if (m && pm[m[1] || ''] !== undefined) return pm[m[1] || ''] + encLocal(m[2]);
  return state.meta.baseIri + encLocal(name);
}
/** 사용자가 입력한 이름 → Turtle 표기 */
function ttlTerm(name, pm = prefixMap()){
  name = String(name || '').trim();
  if (/^(https?):\/\//i.test(name) || /^urn:/i.test(name)) return `<${name}>`;
  const m = name.match(/^([A-Za-z][\w\-]*)?:(.*)$/);
  if (m && pm[m[1] || ''] !== undefined){
    return SAFE_LOCAL.test(m[2]) ? `${m[1] || ''}:${m[2]}` : `<${pm[m[1] || ''] + encLocal(m[2])}>`;
  }
  return SAFE_LOCAL.test(name) ? `${state.meta.prefix || ''}:${name}` : `<${state.meta.baseIri + encLocal(name)}>`;
}
function isExternal(name){
  const m = String(name || '').match(/^([A-Za-z][\w\-]*)?:/);
  if (/^(https?):\/\//i.test(name)) return !String(name).startsWith(state.meta.baseIri);
  return !!(m && (m[1] || '') !== (state.meta.prefix || ''));
}
function uniqueName(base, used){
  if (!used.has(base)) return base;
  let i = 2; while (used.has(base + i)) i++; return base + i;
}
const classNames = (exceptId) => new Set(state.nodes.filter(n => n.id !== exceptId).map(n => n.name));

/* ---------- 변경 ---------- */
function addNode(x, y){
  const used = classNames();
  let k = state.nodes.length + 1, label, name;
  do { label = `클래스 ${k}`; name = deriveName(label, 'class'); k++; } while (used.has(name));
  const n = { id: uid('n'), x, y, label, name, nameAuto: true, comment: '', color: COLORS[0], attrs: [] };
  state.nodes.push(n); return n;
}
function addEdge(from, to){
  const used = new Set(state.edges.map(e => e.name));
  const e = { id: uid('e'), from, to, kind: 'object', label: '', name: uniqueName('relatedTo', used), nameAuto: true, comment: '', functional: false };
  state.edges.push(e); return e;
}
function deleteSelection(){
  if (!selection) return;
  checkpoint();
  if (selection.type === 'node'){
    state.nodes = state.nodes.filter(n => n.id !== selection.id);
    state.edges = state.edges.filter(e => e.from !== selection.id && e.to !== selection.id);
  } else state.edges = state.edges.filter(e => e.id !== selection.id);
  selection = null; renderAll(); persist();
}

/* ---------- 측정 ---------- */
const mctx = document.createElement('canvas').getContext('2d');
function textW(s, font){ mctx.font = font; return mctx.measureText(s).width; }
const shortType = t => String(t).replace(/^xsd:/, '');
const attrText = a => `${a.name || '?'} : ${shortType(a.type)}`;
function nodeSize(n){
  const title = n.label || n.name || '(이름 없음)';
  let w = textW(title, `700 13px ${FONT}`) + 32;
  const showSub = n.label && n.name && n.label !== n.name;
  if (showSub) w = Math.max(w, textW(n.name, `10.5px ${FONT}`) + 28);
  n.attrs.forEach(a => { w = Math.max(w, textW(attrText(a), `12px ${FONT}`) + 26); });
  w = Math.max(110, Math.ceil(w));
  const head = showSub ? 46 : 36;
  const h = head + (n.attrs.length ? n.attrs.length * 18 + 8 : 0);
  return { w, h, head, showSub };
}
function rectPoint(n, s, tx, ty){
  const dx = tx - n.x, dy = ty - n.y;
  if (!dx && !dy) return { x: n.x, y: n.y };
  const sc = Math.min((s.w / 2) / Math.abs(dx || 1e-9), (s.h / 2) / Math.abs(dy || 1e-9));
  return { x: n.x + dx * sc, y: n.y + dy * sc };
}

/* ---------- 렌더링 ---------- */
function el(tag, attrs, text){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
function renderAll(){ renderCanvas(); renderPanel(); }
function applyView(){
  gView.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
  $('#zoomLabel').textContent = Math.round(view.k * 100) + '%';
}
function renderCanvas(){
  applyView();
  gEdges.textContent = ''; gNodes.textContent = '';
  const sizes = new Map(state.nodes.map(n => [n.id, nodeSize(n)]));
  const nameCount = new Map();
  state.nodes.forEach(n => nameCount.set(n.name, (nameCount.get(n.name) || 0) + 1));
  const groups = new Map();
  state.edges.forEach(e => {
    const key = e.from === e.to ? 'self:' + e.from : [e.from, e.to].sort().join('|');
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  });
  groups.forEach(list => list.forEach((e, i) => drawEdge(e, i, list.length, sizes)));
  state.nodes.forEach(n => drawNode(n, sizes.get(n.id), nameCount.get(n.name) > 1));
  $('#empty').hidden = state.nodes.length > 0;
}
function drawNode(n, s, dup){
  const sel = selection && selection.type === 'node' && selection.id === n.id;
  const cls = ['node']; if (sel) cls.push('selected'); if (dup) cls.push('dup'); if (isExternal(n.name)) cls.push('external');

function drawEdge(e, i, m, sizes){

    d = `M${S.x},${S.y} C${S.x},${S.y - r * 1.4} ${E.x + r * 1.4},${E.y} ${E.x},${E.y}`;
    lx = S.x + r * 0.75; ly = S.y - r * 0.6;
  } else {
    const [p, q] = a.id < b.id ? [a, b] : [b, a];
    const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy) || 1;

      const cx = (a.x + b.x) / 2 + nx * off * 2, cy = (a.y + b.y) / 2 + ny * off * 2;

    } else {
      const P0 = rectPoint(a, sa, b.x, b.y), P2 = rectPoint(b, sb, a.x, a.y);
      d = `M${P0.x},${P0.y} L${P2.x},${P2.y}`;
      lx = (P0.x + P2.x) / 2; ly = (P0.y + P2.y) / 2;
    }

  const sub = e.kind === 'subclass';
  const g = el('g', { class: 'edge' + (sel ? ' selected' : '') + (sub ? ' sub' : ''), 'data-edge': e.id });
  g.append(el('path', { class: 'hit', d }));
  g.append(el('path', { class: 'line', d, 'marker-end': `url(#${sub ? 'tri' : 'arrow'}${sel ? '-sel' : ''})` }));

    const tw = textW(text, sub ? `italic 11px ${FONT}` : `12px ${FONT}`) + 14;
    g.append(el('rect', { class: 'pill', x: lx - tw / 2, y: ly - 10, width: tw, height: 20, rx: 10 }));

/* ---------- Turtle 내보내기 ---------- */
function lit(s){
  const v = String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '\\r').replace(/\t/g, '\\t');
  const lang = (state.meta.lang || '').trim();

}
function classExpr(terms){
  const u = [...new Set(terms)];
  return u.length === 1 ? u[0] : `[ a owl:Class ; owl:unionOf ( ${u.join(' ')} ) ]`;
}
function block(subject, types, props){
  const lines = [`${subject} a ${types.join(' , ')}`];
  props.forEach(([p, o]) => lines.push(`    ${p} ${o}`));
  return lines.join(' ;\n') + ' .';
}
function toTurtle(){
  const pm = prefixMap(), m = state.meta;
  const out = [];
  const used = new Set(['rdf', 'rdfs', 'owl', 'xsd', m.prefix || '']);
  const extra = Object.entries(pm).filter(([k]) => !(k in STD) && k !== (m.prefix || ''));
  out.push(`@prefix ${m.prefix || ''}: <${m.baseIri}> .`);
  extra.forEach(([k, v]) => out.push(`@prefix ${k}: <${v}> .`));
  Object.entries(STD).forEach(([k, v]) => out.push(`@prefix ${k}: <${v}> .`));
  out.push('');
  const onto = [];
  if (m.title) onto.push(['rdfs:label', lit(m.title)]);
  out.push(block(`<${m.ontologyIri}>`, ['owl:Ontology'], onto));

  const term = n => ttlTerm(n.name, pm);
  if (state.nodes.length){
    out.push('', '#################################################################', '#    Classes', '#################################################################', '');
    state.nodes.forEach(n => {
      const props = [];
      if (n.label) props.push(['rdfs:label', lit(n.label)]);
      if (n.comment) props.push(['rdfs:comment', lit(n.comment)]);
      const parents = [...new Set(state.edges.filter(e => e.kind === 'subclass' && e.from === n.id).map(e => nodeById(e.to)).filter(Boolean).map(term))];
      parents.forEach(t => props.push(['rdfs:subClassOf', t]));
      out.push(block(term(n), ['owl:Class'], props), '');
    });
  }
  // 객체 속성: 이름별로 묶기
  const ops = new Map();
  state.edges.filter(e => e.kind === 'object').forEach(e => {
    const a = nodeById(e.from), b = nodeById(e.to); if (!a || !b) return;
    const key = ttlTerm(e.name || 'relatedTo', pm);
    if (!ops.has(key)) ops.set(key, { label: '', comment: '', functional: false, dom: [], rng: [] });
    const o = ops.get(key);
    if (!o.label && e.label) o.label = e.label;
    if (!o.comment && e.comment) o.comment = e.comment;
    o.functional = o.functional || !!e.functional;
    o.dom.push(term(a)); o.rng.push(term(b));
  });
  if (ops.size){
    out.push('#################################################################', '#    Object Properties', '#################################################################', '');
    ops.forEach((o, key) => {
      const props = [];
      if (o.label) props.push(['rdfs:label', lit(o.label)]);
      if (o.comment) props.push(['rdfs:comment', lit(o.comment)]);
      props.push(['rdfs:domain', classExpr(o.dom)], ['rdfs:range', classExpr(o.rng)]);
      out.push(block(key, o.functional ? ['owl:ObjectProperty', 'owl:FunctionalProperty'] : ['owl:ObjectProperty'], props), '');
    });
  }
  // 데이터 속성
  const dps = new Map();
  state.nodes.forEach(n => n.attrs.forEach(a => {
    if (!a.name) return;
    const key = ttlTerm(a.name, pm);
    if (!dps.has(key)) dps.set(key, { dom: [], types: new Set() });
    dps.get(key).dom.push(term(n)); dps.get(key).types.add(a.type || 'rdfs:Literal');
  }));
  if (dps.size){
    out.push('#################################################################', '#    Data Properties', '#################################################################', '');
    dps.forEach((o, key) => {
      const range = o.types.size === 1 ? [...o.types][0] : 'rdfs:Literal';
      out.push(block(key, ['owl:DatatypeProperty'], [['rdfs:domain', classExpr(o.dom)], ['rdfs:range', range]]), '');
    });
  }
  // 배치 정보 (주석이라 다른 도구는 무시함)
  const layout = { v: 1, nodes: {}, edges: [] };
  state.nodes.forEach(n => { layout.nodes[fullIri(n.name, pm)] = [Math.round(n.x), Math.round(n.y), n.color]; });
  state.edges.forEach(e => {
    const a = nodeById(e.from), b = nodeById(e.to); if (!a || !b) return;
    layout.edges.push([fullIri(a.name, pm), e.kind === 'subclass' ? 'sub' : fullIri(e.name, pm), fullIri(b.name, pm)]);
  });
  out.push('# 아래 줄은 RDF Arrows가 다시 불러올 때 쓰는 배치 정보입니다 (주석이라 다른 도구는 무시합니다).');
  out.push('# ' + LAYOUT_TAG + ' ' + JSON.stringify(layout));
  return out.join('\n') + '\n';
}
function problems(){
  const list = [];
  const cnt = new Map();
  state.nodes.forEach(n => cnt.set(n.name, (cnt.get(n.name) || 0) + 1));
  cnt.forEach((c, nm) => { if (c > 1) list.push(`클래스 이름 "${nm}"이 ${c}번 쓰여서 하나로 합쳐집니다.`); });
  state.nodes.forEach(n => { if (!n.name) list.push(`이름 없는 클래스가 있습니다.`); });
  const cls = new Set(state.nodes.map(n => fullIri(n.name)));
  state.edges.filter(e => e.kind === 'object').forEach(e => { if (cls.has(fullIri(e.name))) list.push(`관계 이름 "${e.name}"이 클래스 이름과 겹칩니다.`); });
  return [...new Set(list)];

    while (cur && cur.value !== R + 'nil' && guard++ < 1000){ const f = objs(cur, R + 'first')[0]; if (f) out.push(f); cur = objs(cur, R + 'rest')[0]; } return out; };
  const namedClasses = (o) => {
    if (o.termType === 'NamedNode') return [o.value];
    if (o.termType === 'BlankNode'){ const u = objs(o, O + 'unionOf')[0]; if (u) return listItems(u).filter(x => x.termType === 'NamedNode').map(x => x.value); }
    return [];
  };
  const subjects = [...new Set(quads.map(q => q.subject))].filter(s => s.termType === 'NamedNode');
  const uniqSubjects = []; const seen = new Set();
  subjects.forEach(s => { if (!seen.has(s.value)){ seen.add(s.value); uniqSubjects.push(s); } });
  const classIris = new Set();
  uniqSubjects.forEach(s => { if (hasType(s, O + 'Class') || hasType(s, RS + 'Class')) classIris.add(s.value); });
  const objProps = uniqSubjects.filter(s => hasType(s, O + 'ObjectProperty'));
  const dataProps = uniqSubjects.filter(s => hasType(s, O + 'DatatypeProperty'));
  uniqSubjects.forEach(s => objs(s, RS + 'subClassOf').forEach(o => { if (classIris.has(s.value) && o.termType === 'NamedNode') classIris.add(o.value); }));
  objProps.forEach(p => { objs(p, RS + 'domain').forEach(o => namedClasses(o).forEach(c => classIris.add(c))); objs(p, RS + 'range').forEach(o => namedClasses(o).forEach(c => classIris.add(c))); });
  classIris.delete(O + 'Thing');
  objProps.forEach(p => classIris.delete(p.value));

  // 기본 네임스페이스 결정
  const ontoSub = uniqSubjects.find(s => hasType(s, O + 'Ontology'));
  const nsOf = iri => iri.replace(/[^#/]*$/, '');
  const nsCount = new Map();
  classIris.forEach(c => nsCount.set(nsOf(c), (nsCount.get(nsOf(c)) || 0) + 1));
  let base = [...nsCount.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || (ontoSub ? ontoSub.value + '#' : 'http://example.org/onto#');
  let prefix = Object.keys(prefixes).find(k => prefixes[k] === base && k !== '') ?? (Object.keys(prefixes).find(k => prefixes[k] === base) ?? 'ex');
  const lang = (() => {
    const langs = new Map();
    quads.forEach(q => { if (q.object.termType === 'Literal' && q.object.language) langs.set(q.object.language, (langs.get(q.object.language) || 0) + 1); });
    return [...langs.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || '';
  })();
  const pickLit = (subj, pred) => {
    const ls = objs(subj, pred).filter(o => o.termType === 'Literal');
    return (ls.find(l => l.language === lang) || ls.find(l => !l.language) || ls[0] || { value: '' }).value;
  };
  const extraPairs = Object.entries(prefixes).filter(([k, v]) => !(k in STD && STD[k] === v) && !(k === prefix && v === base) && v !== base);
  const meta = {
    title: ontoSub ? (pickLit(ontoSub, RS + 'label') || pickLit(ontoSub, 'http://purl.org/dc/terms/title')) : '',
    ontologyIri: ontoSub ? ontoSub.value : base.replace(/[#/]$/, ''),
    baseIri: base, prefix, lang,
    extraPrefixes: extraPairs.map(([k, v]) => `${k}: ${v}`).join('\n')
  };
  const compact = iri => {
    if (iri.startsWith(base) && SAFE_LOCAL.test(decodeURIComponent(iri.slice(base.length)))) return decodeURIComponent(iri.slice(base.length));
    for (const [k, v] of extraPairs.concat(Object.entries(STD))) if (iri.startsWith(v) && SAFE_LOCAL.test(iri.slice(v.length))) return `${k}:${iri.slice(v.length)}`;
    return iri;
  };
  const term = iri => ({ termType: 'NamedNode', value: iri });

  const st = blankState(); st.meta = meta;
  const idOf = new Map();
  classIris.forEach(iri => {
    const s = term(iri);
    const n = { id: 'n' + (st.seq++), x: 0, y: 0, label: pickLit(s, RS + 'label'), name: compact(iri), nameAuto: false, comment: pickLit(s, RS + 'comment'), color: COLORS[0], attrs: [] };
    st.nodes.push(n); idOf.set(iri, n.id);
  });
  // 배치 정보
  let layout = null;
  const lm = text.match(new RegExp('^#\\s*' + LAYOUT_TAG.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*(\\{.*\\})\\s*$', 'm'));
  if (lm){ try { layout = JSON.parse(lm[1]); } catch (e) {} }
  // 상속
  classIris.forEach(iri => objs(term(iri), RS + 'subClassOf').forEach(o => {
    if (o.termType === 'NamedNode' && idOf.has(o.value)) st.edges.push({ id: 'e' + (st.seq++), from: idOf.get(iri), to: idOf.get(o.value), kind: 'subclass', label: '', name: 'relatedTo', nameAuto: false, comment: '', functional: false });
  }));
  // 객체 속성
  const layoutPairs = new Map();
  if (layout && Array.isArray(layout.edges)) layout.edges.forEach(([f, p, t]) => { if (p !== 'sub'){ if (!layoutPairs.has(p)) layoutPairs.set(p, []); layoutPairs.get(p).push([f, t]); } });
  objProps.forEach(p => {
    const dom = objs(p, RS + 'domain').flatMap(namedClasses).filter(c => idOf.has(c));
    const rng = objs(p, RS + 'range').flatMap(namedClasses).filter(c => idOf.has(c));
    let pairs = layoutPairs.get(p.value);
    pairs = pairs ? pairs.filter(([f, t]) => idOf.has(f) && idOf.has(t)) : [];
    if (!pairs.length) dom.forEach(d => rng.forEach(r => pairs.push([d, r])));
    const label = pickLit(p, RS + 'label'), comment = pickLit(p, RS + 'comment'), functional = hasType(p, O + 'FunctionalProperty');
    pairs.forEach(([f, t]) => st.edges.push({ id: 'e' + (st.seq++), from: idOf.get(f), to: idOf.get(t), kind: 'object', label, name: compact(p.value), nameAuto: false, comment, functional }));
  });
  // 데이터 속성
  dataProps.forEach(p => {
    const rng = objs(p, RS + 'range')[0];
    const type = rng ? compact(rng.value) : 'rdfs:Literal';
    objs(p, RS + 'domain').flatMap(namedClasses).forEach(c => {
      const n = st.nodes.find(x => x.id === idOf.get(c));
      if (n) n.attrs.push({ name: compact(p.value), type: XSD_TYPES.includes(type) ? type : type });
    });
  });
  // 위치
  let placed = 0;
  if (layout && layout.nodes){
    st.nodes.forEach(n => { const iri = [...idOf.entries()].find(([, id]) => id === n.id)[0]; const v = layout.nodes[iri];
      if (v){ n.x = v[0]; n.y = v[1]; if (v[2]) n.color = v[2]; n.placed = true; placed++; } });
  }
  if (placed < st.nodes.length) autoLayout(st, true);
  st.nodes.forEach(n => delete n.placed);
  return st;
}

/* ---------- 자동 배치 (간단한 힘 기반) ---------- */
function autoLayout(st, onlyUnplaced){
  const nodes = st.nodes; const N = nodes.length; if (!N) return;
  const movable = n => !onlyUnplaced || !n.placed;
  const R = Math.max(150, N * 32);
  nodes.forEach((n, i) => { if (movable(n)){ const a = (i / N) * Math.PI * 2; n.x = Math.cos(a) * R + (Math.random() - .5) * 10; n.y = Math.sin(a) * R + (Math.random() - .5) * 10; } });
  const idx = new Map(nodes.map((n, i) => [n.id, i]));
  const links = st.edges.filter(e => e.from !== e.to).map(e => [idx.get(e.from), idx.get(e.to)]).filter(l => l[0] !== undefined && l[1] !== undefined);
  const sizes = nodes.map(nodeSize);
  const ideal = 230;
  for (let it = 0; it < 400; it++){
    const t = 1 - it / 400;
    const fx = new Float64Array(N), fy = new Float64Array(N);
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++){
      let dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y; let d2 = dx * dx + dy * dy;
      if (d2 < 1){ dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
      const minD = (sizes[i].w + sizes[j].w) / 2 + 40;
      const f = (ideal * ideal + minD * minD) / d2;
      const d = Math.sqrt(d2); fx[i] += dx / d * f; fy[i] += dy / d * f; fx[j] -= dx / d * f; fy[j] -= dy / d * f;
    }
    links.forEach(([a, b]) => {
      const dx = nodes[b].x - nodes[a].x, dy = nodes[b].y - nodes[a].y, d = Math.hypot(dx, dy) || 1;
      const f = (d - ideal) * 0.08; fx[a] += dx / d * f; fy[a] += dy / d * f; fx[b] -= dx / d * f; fy[b] -= dy / d * f;
    });
    for (let i = 0; i < N; i++){
      fx[i] -= nodes[i].x * 0.01; fy[i] -= nodes[i].y * 0.01;
      if (!movable(nodes[i])) continue;
      const m = Math.hypot(fx[i], fy[i]) || 1, step = Math.min(m, 30 * t + 1);
      nodes[i].x += fx[i] / m * step; nodes[i].y += fy[i] / m * step;
    }
  }
  nodes.forEach(n => { n.x = Math.round(n.x); n.y = Math.round(n.y); });
}

/* ---------- 화면 ---------- */
function toWorld(ev){
  const r = svg.getBoundingClientRect();
  return { x: (ev.clientX - r.left - view.x) / view.k, y: (ev.clientY - r.top - view.y) / view.k };
}
function fit(){
  const r = svg.getBoundingClientRect();
  if (!state.nodes.length){ view = { x: r.width / 2, y: r.height / 2, k: 1 }; applyView(); return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  state.nodes.forEach(n => { const s = nodeSize(n); x0 = Math.min(x0, n.x - s.w / 2); y0 = Math.min(y0, n.y - s.h / 2 - 60); x1 = Math.max(x1, n.x + s.w / 2 + 60); y1 = Math.max(y1, n.y + s.h / 2); });
  const pad = 60;
  const k = Math.min(1.4, Math.max(0.2, Math.min((r.width - pad * 2) / (x1 - x0), (r.height - pad * 2) / (y1 - y0))));
  view = { k, x: r.width / 2 - (x0 + x1) / 2 * k, y: r.height / 2 - (y0 + y1) / 2 * k };
  applyView(); persist();
}
function zoomAt(k2, mx, my){
  k2 = Math.min(3, Math.max(0.2, k2));
  view.x = mx - (mx - view.x) * k2 / view.k; view.y = my - (my - view.y) * k2 / view.k; view.k = k2;
  applyView(); persist();
}

/* ---------- 포인터 ---------- */
let drag = null;
const nodeAtPoint = (cx, cy) => { const t = document.elementFromPoint(cx, cy); const g = t && t.closest && t.closest('[data-node]'); return g ? g.dataset.node : null; };
svg.addEventListener('pointerdown', ev => {
  if (ev.button !== 0) return;
  const t = ev.target;
  const halo = t.closest('[data-halo]'), nodeG = t.closest('[data-node]'), edgeG = t.closest('[data-edge]');
  const p = toWorld(ev);
  if (halo){
    drag = { mode: 'link', from: halo.dataset.halo, sx: ev.clientX, sy: ev.clientY, moved: false };
  } else if (nodeG){
    const id = nodeG.dataset.node; select({ type: 'node', id });
    const n = nodeById(id); drag = { mode: 'move', id, start: p, orig: { x: n.x, y: n.y }, moved: false };
  } else if (edgeG){
    select({ type: 'edge', id: edgeG.dataset.edge }); drag = null;
  } else {
    drag = { mode: 'pan', sx: ev.clientX, sy: ev.clientY, ox: view.x, oy: view.y, moved: false };
  }
});
window.addEventListener('pointermove', ev => {
  if (!drag) return;
  if (drag.mode === 'move'){
    const p = toWorld(ev), n = nodeById(drag.id); if (!n) return;
    if (!drag.moved){ if (Math.hypot(p.x - drag.start.x, p.y - drag.start.y) * view.k < 3) return; checkpoint(); drag.moved = true; }
    n.x = Math.round(drag.orig.x + p.x - drag.start.x); n.y = Math.round(drag.orig.y + p.y - drag.start.y);
    renderCanvas();
  } else if (drag.mode === 'pan'){
    const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) < 3) return;
    drag.moved = true; view.x = drag.ox + dx; view.y = drag.oy + dy; applyView();
  } else if (drag.mode === 'link'){
    if (!drag.moved && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) < 8) return;
    drag.moved = true;
    const a = nodeById(drag.from); const p = toWorld(ev);
    const s = rectPoint(a, nodeSize(a), p.x, p.y);
    gOverlay.textContent = '';
    gOverlay.append(el('path', { class: 'temp', d: `M${s.x},${s.y} L${p.x},${p.y}`, 'marker-end': 'url(#arrow-sel)' }));
    const target = nodeAtPoint(ev.clientX, ev.clientY);
    gNodes.querySelectorAll('.linktarget').forEach(g => g.classList.remove('linktarget'));
    if (target){ const g = gNodes.querySelector(`[data-node="${target}"]`); g && g.classList.add('linktarget'); }
  }
});
window.addEventListener('pointerup', ev => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.mode === 'link'){
    gOverlay.textContent = '';
    gNodes.querySelectorAll('.linktarget').forEach(g => g.classList.remove('linktarget'));
    if (!d.moved) return;
    const target = nodeAtPoint(ev.clientX, ev.clientY);
    checkpoint();
    let toId = target;
    if (!toId){ const p = toWorld(ev); toId = addNode(p.x, p.y).id; }
    const e = addEdge(d.from, toId);
    selection = { type: 'edge', id: e.id }; renderAll(); persist(); focusField('label');
  } else if (d.mode === 'move'){ if (d.moved) persist(); }
  else if (d.mode === 'pan'){ if (d.moved) persist(); else select(null); }
});
svg.addEventListener('dblclick', ev => {
  const nodeG = ev.target.closest('[data-node]'), edgeG = ev.target.closest('[data-edge]');
  if (nodeG){ select({ type: 'node', id: nodeG.dataset.node }); focusField('label'); return; }
  if (edgeG){ select({ type: 'edge', id: edgeG.dataset.edge }); focusField('label'); return; }
  checkpoint();
  const p = toWorld(ev); const n = addNode(Math.round(p.x), Math.round(p.y));
  selection = { type: 'node', id: n.id }; renderAll(); persist(); focusField('label');
});
svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  if (ev.ctrlKey || ev.metaKey){ zoomAt(view.k * Math.exp(-ev.deltaY * 0.01), ev.clientX - r.left, ev.clientY - r.top); }
  else { view.x -= ev.deltaX; view.y -= ev.deltaY; applyView(); persist(); }
}, { passive: false });
$('#zIn').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(view.k * 1.2, r.width / 2, r.height / 2); };
$('#zOut').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(view.k / 1.2, r.width / 2, r.height / 2); };
$('#zFit').onclick = fit;

window.addEventListener('keydown', ev => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
  const mod = ev.ctrlKey || ev.metaKey;
  if (mod && ev.key.toLowerCase() === 'z' && !typing){ ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if (mod && ev.key.toLowerCase() === 'y' && !typing){ ev.preventDefault(); redo(); return; }
  if (typing){ if (ev.key === 'Escape') document.activeElement.blur(); return; }
  if (ev.key === 'Delete' || ev.key === 'Backspace'){ ev.preventDefault(); deleteSelection(); }
  else if (ev.key === 'Escape'){ if (!$('#modal').hidden) closeModal(); else select(null); }
});

/* ---------- 파일 ---------- */
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200); }
function fileName(){ return (deriveName(state.meta.title || 'ontology', 'prop') || 'ontology') + '.ttl'; }
function download(){
  const blob = new Blob([toTurtle()], { type: 'text/turtle;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName();
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function loadText(text, name){
  try {
    const st = importTurtle(text);
    checkpoint(); state = st; selection = null; renderAll(); fit(); persist();
    toast(`${name || 'TTL'} 불러옴: 클래스 ${st.nodes.length}개, 관계 ${st.edges.length}개`);
  } catch (e){ toast('불러오기 실패: ' + (e.message || e)); console.error(e); }
}
$('#fileIn').addEventListener('change', ev => {
  const f = ev.target.files[0]; if (!f) return;
  f.text().then(t => loadText(t, f.name)); ev.target.value = '';
});
const wrap = $('#canvasWrap');
wrap.addEventListener('dragover', ev => { ev.preventDefault(); $('#dropOverlay').classList.add('on'); });
wrap.addEventListener('dragleave', ev => { if (ev.target === wrap || !wrap.contains(ev.relatedTarget)) $('#dropOverlay').classList.remove('on'); });
wrap.addEventListener('drop', ev => {
  ev.preventDefault(); $('#dropOverlay').classList.remove('on');
  const f = ev.dataTransfer.files[0]; if (f) f.text().then(t => loadText(t, f.name));
});

/* ---------- 모달 ---------- */
function openModal(){
  const ttl = toTurtle();
  $('#ttlOut').value = ttl;
  const st = $('#ttlStatus');
  let parsed = null, err = null;
  try { parsed = new N3.Parser().parse(ttl); } catch (e){ err = e; }
  const probs = problems();
  st.innerHTML = (err ? `<span class="bad">문법 오류: ${esc(err.message)}</span>` : `<span class="ok">✓ Turtle 문법 검사 통과 (트리플 ${parsed.length}개)</span>`) +
    (probs.length ? '<br>' + probs.map(p => `<span class="bad">⚠ ${esc(p)}</span>`).join('<br>') : '');
  $('#modal').hidden = false;
}
function closeModal(){ $('#modal').hidden = true; }
$('#bView').onclick = openModal;
$('#mClose').onclick = closeModal;
$('#modal').addEventListener('click', ev => { if (ev.target.id === 'modal') closeModal(); });
$('#mCopy').onclick = async () => {
  try { await navigator.clipboard.writeText($('#ttlOut').value); toast('복사했습니다'); }
  catch (e){ $('#ttlOut').select(); toast('전체 선택했습니다. Ctrl/⌘+C로 복사하세요'); }
};
$('#mDownload').onclick = download;
$('#bDownload').onclick = download;

/* ---------- 툴바 ---------- */
$('#bNew').onclick = () => { checkpoint(); state = blankState(); selection = null; renderAll(); fit(); persist(); toast('새 캔버스 (되돌리려면 ⌘/Ctrl+Z)'); };
$('#bOpen').onclick = () => $('#fileIn').click();
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
$('#bLayout').onclick = () => { if (!state.nodes.length) return; checkpoint(); autoLayout(state, false); renderCanvas(); fit(); persist(); };

const SAMPLE = `@prefix ex: <http://example.org/org#> .
@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
@prefix owl: <http://www.w3.org/2002/07/owl#> .
@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .
<http://example.org/org> a owl:Ontology ; rdfs:label "조직 예시"@ko .
ex:Person a owl:Class ; rdfs:label "사람"@ko .
ex:Organization a owl:Class ; rdfs:label "조직"@ko .
ex:Unit a owl:Class ; rdfs:label "부대"@ko ; rdfs:subClassOf ex:Organization .
ex:Mission a owl:Class ; rdfs:label "임무"@ko .
ex:memberOf a owl:ObjectProperty ; rdfs:label "소속"@ko ; rdfs:domain ex:Person ; rdfs:range ex:Organization .
ex:commands a owl:ObjectProperty ; rdfs:label "지휘"@ko ; rdfs:domain ex:Person ; rdfs:range ex:Unit .
ex:assignedTo a owl:ObjectProperty ; rdfs:label "수행"@ko ; rdfs:domain ex:Unit ; rdfs:range ex:Mission .
ex:name a owl:DatatypeProperty ; rdfs:domain ex:Person ; rdfs:range xsd:string .
ex:startDate a owl:DatatypeProperty ; rdfs:domain ex:Mission ; rdfs:range xsd:date .
# ${LAYOUT_TAG} {"v":1,"nodes":{"http://example.org/org#Person":[-260,-40,"#e8f0fe"],"http://example.org/org#Organization":[120,-160,"#e6f4ea"],"http://example.org/org#Unit":[120,60,"#e6f4ea"],"http://example.org/org#Mission":[440,60,"#fef7e0"]}}
`;
const loadSample = () => loadText(SAMPLE, '예시');
$('#bSample').onclick = loadSample; $('#bSample2').onclick = loadSample;

/* ---------- 시작 ---------- */
let restored = false;
try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
  if (saved && saved.state && Array.isArray(saved.state.nodes)){ state = saved.state; if (saved.view) view = saved.view; restored = true; }
} catch (e) {}
renderAll(); updateHistoryButtons();
if (!restored) requestAnimationFrame(fit);
window.__rdfArrows = { get state(){ return state; }, toTurtle, importTurtle };
})();
</script>
